# SPDX-License-Identifier: MIT

[package]
name = "pg_otel"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
atoi.workspace = true
eyre.workspace = true
pgrx.workspace = true
prost.workspace = true
reqwest.workspace = true
url.workspace = true

opentelemetry = { workspace = true }
opentelemetry-proto = {
  workspace = true,
  features = ["gen-tonic-messages", "logs", "metrics", "trace"]
}

# [pg_test] dependencies
googletest = { workspace = true, optional = true }
postgres = { workspace = true, optional = true }

[dev-dependencies]
googletest.workspace = true
pgrx-tests.workspace = true
postgres.workspace = true
tiny_http.workspace = true

[features]
default = ["pg15"]
pg_test = ["dep:googletest", "dep:postgres"]
pg15 = ["pgrx-tests/pg15", "pgrx/pg15"]
pg16 = ["pgrx-tests/pg16", "pgrx/pg16"]
pg17 = ["pgrx-tests/pg17", "pgrx/pg17"]
pg18 = ["pgrx-tests/pg18", "pgrx/pg18"]
pg19 = ["pgrx-tests/pg19", "pgrx/pg19"]
