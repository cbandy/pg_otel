# SPDX-License-Identifier: MIT

[package]
name = "sequencing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
pgrx.workspace = true

# [pg_test] dependencies
googletest = { workspace = true, optional = true }
postgres = { workspace = true, optional = true }

[dev-dependencies]
googletest.workspace = true
pgrx-tests.workspace = true
postgres.workspace = true

[features]
default = ["pg15"]
pg_test = ["dep:googletest", "dep:postgres"]
# Historical reference: assertions for older engines supported by pgrx (pg13, pg14)
# are preserved for comparison but are not exercised in CI (which targets actively supported pg_otel versions).
pg13 = ["pgrx-tests/pg13", "pgrx/pg13"]
pg14 = ["pgrx-tests/pg14", "pgrx/pg14"]
pg15 = ["pgrx-tests/pg15", "pgrx/pg15"]
pg16 = ["pgrx-tests/pg16", "pgrx/pg16"]
pg17 = ["pgrx-tests/pg17", "pgrx/pg17"]
pg18 = ["pgrx-tests/pg18", "pgrx/pg18"]
pg19 = ["pgrx-tests/pg19", "pgrx/pg19"]
